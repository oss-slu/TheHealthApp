name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read            
      id-token: write           
      attestations: write       
      artifact-metadata: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: frontend/dist
          format: spdx-json
          output-file: TheHealthApp-frontend-sbom.spdx.json
          upload-artifact: false

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: TheHealthApp-frontend-sbom
          path: TheHealthApp-frontend-sbom.spdx.json
          if-no-files-found: error

      - name: Attest frontend SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: TheHealthApp-frontend-sbom.spdx.json
                
      - name: Verify frontend SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify TheHealthApp-frontend-sbom.spdx.json \
            --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/dist
          retention-days: 7

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest httpx python-multipart

      - run: |
          export MONGO_URL="mongodb://localhost:27017"
          export MONGO_DB_NAME="healthapp_test"
          export JWT_ACCESS_SECRET="test-access-secret"
          export JWT_REFRESH_SECRET="test-refresh-secret"
          export ACCESS_TOKEN_EXPIRE_MINUTES="30"
          export REFRESH_TOKEN_EXPIRE_DAYS="7"
          PYTHONPATH=$(pwd) pytest tests -v
